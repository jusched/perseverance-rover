<!doctype html>
<html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Perseverance</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#c98a52}canvas{display:block}
#mcc{position:fixed;top:12px;right:12px;width:min(300px,calc(100vw - 24px));padding:10px 12px;box-sizing:border-box;pointer-events:none;
  font:11px/1.35 ui-monospace,Consolas,monospace;color:#ffd9a8;background:rgba(32,12,5,.6);backdrop-filter:blur(6px);
  border:1px solid rgba(255,178,92,.35);border-radius:6px;box-shadow:0 0 24px rgba(0,0,0,.35)}
#mcc[hidden]{display:none}
#mcc h1{margin:0 0 8px;font-size:11px;letter-spacing:.14em;color:#ffb25c;display:flex;justify-content:space-between}
#mcc h1 span{color:#c99a6a;letter-spacing:0}
#mcc .card{padding:7px 0;border-top:1px solid rgba(255,178,92,.2)}
#mcc h2{margin:0;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between}
#mcc em{font-style:normal;color:#8fe39a}
#mcc [data-state=loading] em{color:#c99a6a}#mcc [data-state=error] em{color:#ff7a6a}
#mcc .row{display:flex;align-items:center;gap:8px;margin:2px 0}
#mcc .val{flex:0 0 112px;white-space:nowrap}
#mcc .val b{font-size:22px;color:#fff3d6;font-weight:600}#mcc .val i{margin-left:4px;font-style:normal;color:#c99a6a}
#mcc canvas{flex:1;min-width:0;height:34px}
#mcc .say{margin:0;color:#f3c995}
#mcc footer{margin-top:2px;font-size:9px;color:#9a7650}
.cam{position:fixed;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;padding:0;border:0;border-radius:50%;cursor:pointer;z-index:5;
  background:radial-gradient(circle,#fff 0 22%,rgba(255,214,140,.9) 30%,rgba(255,170,70,.35) 60%,transparent 72%);animation:glow 1.8s ease-in-out infinite}
.cam[hidden]{display:none}
.cam:hover{animation-duration:.6s}
@keyframes glow{50%{transform:scale(1.35);filter:brightness(1.4)}}
.cam .tip{position:absolute;right:28px;top:50%;translate:0 -50%;white-space:nowrap;padding:4px 8px;border-radius:4px;opacity:0;pointer-events:none;transition:opacity .15s;
  background:rgba(32,12,5,.85);border:1px solid rgba(255,178,92,.5);color:#fff3d6;font:12px/1.2 ui-monospace,Consolas,monospace;text-align:left}
.cam .tip small{display:block;font-size:9px;color:#c99a6a}
.cam:hover .tip{opacity:1}
#shutter{position:fixed;inset:0;z-index:20;pointer-events:none}
#shutter i{position:absolute;left:0;right:0;height:0;background:#000}
#shutter i:first-child{top:0}#shutter i:nth-child(2){bottom:0}
#shutter b{position:absolute;inset:0;background:#fff;opacity:0}
#shutter.go i{animation:iris .38s ease-in-out}
#shutter.go b{animation:flash .5s ease-out .17s}
@keyframes iris{50%{height:52%}}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
#photo{position:fixed;inset:0;z-index:15;display:grid;place-items:center;background:rgba(10,4,2,.62);backdrop-filter:blur(3px)}
#photo[hidden]{display:none}
#photo figure{margin:0;width:min(88vw,1100px);padding:14px 14px 10px;box-sizing:border-box;background:#1b0d07;border:1px solid rgba(255,178,92,.4);border-radius:6px;box-shadow:0 20px 70px rgba(0,0,0,.6);
  font:13px/1.4 ui-monospace,Consolas,monospace;color:#ffd9a8;position:relative}
#photo .x{position:absolute;top:-12px;right:-12px;width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,178,92,.5);background:#1b0d07;color:#ffd9a8;cursor:pointer}
#photo .frame{position:relative;background:#000;width:fit-content;max-width:100%;min-width:min(60vw,640px);min-height:240px;margin:auto;display:grid;place-items:center;overflow:hidden}
#photo img{max-width:100%;max-height:calc(100vh - 150px);display:block;cursor:zoom-in;opacity:0}
#photo[data-state=ok] img{opacity:1}
#photo img.develop{animation:develop 2.8s ease-out}
@keyframes develop{0%{filter:brightness(0) blur(10px) saturate(0);clip-path:inset(0 0 100% 0)}25%{filter:brightness(.35) blur(8px) saturate(.1)}100%{filter:none;clip-path:inset(0)}}
#photo .wait{position:absolute;color:#c99a6a;animation:pulse 1s infinite alternate}
#photo[data-state=ok] .wait{display:none}
@keyframes pulse{to{opacity:.35}}
#photo figcaption{margin-top:8px;font-size:15px;color:#fff3d6;display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
#photo figcaption em{margin-left:auto;font-style:normal;color:#c99a6a}
#photo p{margin:4px 0 0;font-size:11px;color:#9a7650}
#photo.zoom{place-items:stretch;background:#000}
#photo.zoom figure{width:100vw;height:100vh;max-width:none;padding:8px;border:0;border-radius:0;display:flex;flex-direction:column;justify-content:center}
#photo.zoom .frame{width:100%;max-width:none;flex:1;min-height:0}
#photo.zoom img{max-height:calc(100vh - 80px);cursor:zoom-out}</style>
</head><body><script type="module" src="/main.js"></script></body></html>
